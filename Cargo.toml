[package]
name = "eclipse-shell"
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"
description = "A Hyprland desktop shell (bar and launcher) for FreeBSD, built with GTK4"

[dependencies]
async-channel = "2.5.0"
gio = { version = "0.22", features = ["v2_80"] }
gio-unix = "0.22"
gtk4 = { version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
pangocairo = "0.22"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
libc = "0.2"
bitflags = "2"
wayland-backend = "0.3"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-scanner = "0.31"

# Line tables in release builds, so a crash's core dump names the code.
[profile.release]
debug = "line-tables-only"
